name: Empaquetat

on:
  push:
    branches:
      - master

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalem pyinstaller
        run: pip install pyinstaller

      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py

      - name: Guardem l'executable
        uses: actions/upload-artifact@v4
        with:
          name: executable-linux
          path: dist/comprova_desplegaments

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalem pyinstaller
        run: pip install pyinstaller

      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalem pyinstaller
        run: pip install pyinstaller

      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py

  comprova:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Descarreguem l'executable
        uses: actions/download-artifact@v4
        with:
          name: executable-linux

      - name: Donem permisos d'execució
        run: chmod +x comprova_desplegaments

      - name: Executem la comprovació
        run: ./comprova_desplegaments example.com
